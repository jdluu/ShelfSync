name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: lint
        # Invoke the biome binary directly: the pnpm wrapper has been observed
        # to crash ("Linter process terminated abnormally") while still exiting
        # 0, which would let a broken lint gate pass vacuously.
        run: pnpm exec biome check .
      - name: typecheck and build
        run: pnpm build
      - name: test
        run: pnpm vitest run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: test (locked)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  frontend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck frontend
        run: npx tsc -b
      - name: install Playwright
        run: pnpm exec playwright install chromium
      - name: install xvfb
        run: sudo apt-get install -y xvfb
      # Compile-only validation: typecheck and bundle the frontend without
      # exercising runtime behavior. A full tauri build needs the full
      # GTK/webkit stack, so the webview bundle serves as the compile gate.
      - name: build frontend bundle
        run: pnpm vite build
