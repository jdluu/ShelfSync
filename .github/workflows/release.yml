name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry Run? (Simulates builds with dummy files)'
        required: false
        type: boolean
        default: false

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Standard Build Flow
      - name: install Rust stable
        if: github.event.inputs.dry_run == 'false'
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: github.event.inputs.dry_run == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && github.event.inputs.dry_run == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev javascriptcoregtk-4.1-dev
      - name: install frontend dependencies
        if: github.event.inputs.dry_run == 'false'
        run: pnpm install --frozen-lockfile
      - name: Build Desktop
        if: github.event.inputs.dry_run == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: pnpm tauri build

      # Dry Run Flow (Mocking)
      - name: Mock Desktop Artifacts
        if: github.event.inputs.dry_run == 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/target/release/bundle/deb
          mkdir -p src-tauri/target/release/bundle/appimage
          mkdir -p src-tauri/target/release/bundle/nsis
          mkdir -p src-tauri/target/release/bundle/msi
          touch src-tauri/target/release/bundle/deb/mock.deb
          touch src-tauri/target/release/bundle/appimage/mock.AppImage
          touch src-tauri/target/release/bundle/nsis/mock.exe
          touch src-tauri/target/release/bundle/msi/mock.msi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Standard Build Flow
      - name: Setup Java
        if: github.event.inputs.dry_run == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        if: github.event.inputs.dry_run == 'false'
        uses: android-actions/setup-android@v3
      - name: install Rust stable
        if: github.event.inputs.dry_run == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Rust cache
        if: github.event.inputs.dry_run == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: install frontend dependencies
        if: github.event.inputs.dry_run == 'false'
        run: pnpm install --frozen-lockfile
      - name: setup Android signing
        if: github.event.inputs.dry_run == 'false' && env.ANDROID_KEY_BASE64 != ''
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
            mkdir -p src-tauri/gen/android/app
            cd src-tauri/gen/android/app
            echo "shelfsync.key.alias=$ANDROID_KEY_ALIAS" > keystore.properties
            echo "shelfsync.key.password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            echo "shelfsync.keystore.password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            base64 -d <<< "$ANDROID_KEY_BASE64" > shelfsync-release.jks
            echo "shelfsync.keystore.path=shelfsync-release.jks" >> keystore.properties
      - name: Build Android (AAB & APK)
        if: github.event.inputs.dry_run == 'false'
        run: |
            export NDK_HOME=$ANDROID_NDK_HOME

            if [ -f "src-tauri/gen/android/keystore.properties" ]; then
              pnpm tauri android build --aab
              pnpm tauri android build --apk
            else
              pnpm tauri android build --apk
            fi

      # Dry Run Flow (Mocking)
      - name: Mock Android Artifacts
        if: github.event.inputs.dry_run == 'true'
        run: |
          mkdir -p src-tauri/gen/android/app/build/outputs/apk/universal/release
          mkdir -p src-tauri/gen/android/app/build/outputs/bundle/release
          touch src-tauri/gen/android/app/build/outputs/apk/universal/release/mock.apk
          touch src-tauri/gen/android/app/build/outputs/bundle/release/mock.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/release/*.aab

  publish:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract Changelog
        id: changelog
        shell: python
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          import os, uuid
          version = os.getenv('VERSION')
          path = 'CHANGELOG.md'
          if not os.path.exists(path):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('notes=No changelog found.\n')
              exit(0)
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
          content = []
          started = False
          for line in lines:
              if line.startswith('## ') and started:
                  break
              if started:
                  content.append(line)
              if line.startswith(f'## {version}'):
                  started = True
          output = "".join(content).strip()
          
          # Use multiline output syntax
          delimiter = f"EOF_{uuid.uuid4().hex}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"notes<<{delimiter}\n")
              f.write(output + "\n")
              f.write(f"{delimiter}\n")

      - name: Create Release and Tag
        uses: softprops/action-gh-release@v2
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TAG_PREFIX: ${{ github.event.inputs.dry_run == 'true' && 'test-v' || 'v' }}
        with:
          tag_name: ${{ env.TAG_PREFIX }}${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.dry_run == 'true' && 'MOCK ' || '' }}Release v${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: ${{ github.event.inputs.dry_run == 'true' }}
          prerelease: ${{ github.event.inputs.dry_run == 'true' }}
          files: artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}