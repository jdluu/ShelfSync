name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to, e.g. v0.0.1'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install Rust stable (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: dtolnay/rust-toolchain@stable

      - name: install Rust stable (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop
        run: pnpm tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            mkdir -p src-tauri/gen/android/app
            printf '%s\n' \
              "shelfsync.key.alias=$ANDROID_KEY_ALIAS" \
              "shelfsync.key.password=$ANDROID_KEY_PASSWORD" \
              "shelfsync.keystore.password=$ANDROID_KEY_PASSWORD" \
              "shelfsync.keystore.path=shelfsync-release.jks" \
              > src-tauri/gen/android/app/keystore.properties

            if ! printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > src-tauri/gen/android/app/shelfsync-release.jks 2>/dev/null || [ ! -s src-tauri/gen/android/app/shelfsync-release.jks ]; then
              echo "ERROR: Failed to decode ANDROID_KEY_BASE64 or keystore is empty" >&2
              exit 1
            fi
            echo "Android signing configured"
          else
            echo "WARNING: ANDROID_KEY_BASE64 is empty, building unsigned"
          fi

      - name: Build Android (AAB and APK)
        run: |
          export NDK_HOME=$ANDROID_NDK_HOME

          pnpm tauri android build --apk
          if [ -f "src-tauri/gen/android/app/keystore.properties" ]; then
            pnpm tauri android build --aab
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/release/*.aab

  publish:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "Publishing assets for tag: $tag"

          echo "Artifact file tree:"
          find artifacts -type f

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No artifact files found in artifacts directory" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; attaching assets with --clobber"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            echo "Release $tag does not exist; creating prerelease"
            gh release create "$tag" --title "$tag" --generate-notes --prerelease "${files[@]}"
          fi

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          release_json=$(gh release view "$tag" --json isPrerelease,assets)
          echo "$release_json"

          is_prerelease=$(echo "$release_json" | jq -r '.isPrerelease')
          asset_count=$(echo "$release_json" | jq '.assets | length')

          echo "Verification: isPrerelease=$is_prerelease, asset_count=$asset_count"

          if [ "$is_prerelease" != "true" ]; then
            echo "Release verification failed: expected prerelease to be true, got $is_prerelease" >&2
            exit 1
          fi

          if [ "$asset_count" -le 0 ]; then
            echo "Release verification failed: asset count is 0" >&2
            exit 1
          fi

          echo "Release verification passed: prerelease is true and $asset_count assets found"
