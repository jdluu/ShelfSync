name: Release

# Builds and publishes release assets for a tag.
#
# Signing material is never stored in this repository or in long-lived workflow
# inputs. It is fetched at build time from Infisical by scripts/sync-secrets.js,
# which is the same code path local development uses.
#
# Required repository secrets (the only ones this workflow needs):
#   INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET
#     A machine identity with read access to the Infisical project paths that
#     scripts/sync-secrets.js reads. They are exchanged for a short-lived token
#     inside the build, so no long-lived token sits in the workflow.
#
# The tag that gets checked out is never taken directly from workflow input.
# It is validated against a strict pattern in the `validate` job first, and only
# that job's output is ever passed to actions/checkout `ref:`, so no unvalidated
# string can reach a ref.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to, e.g. v0.0.1'
        required: true
        type: string
      release_type:
        description: 'How to mark the release'
        required: false
        type: choice
        default: prerelease
        options:
          - prerelease
          - stable
  push:
    tags:
      - 'v*'

# Never cancel a release build; never let two run against the same tag at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release_type: ${{ steps.check.outputs.release_type }}
    steps:
      - name: Validate the tag and release type
        id: check
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"

          # Anchored, shell-safe pattern: letters, digits, dot, dash, plus only.
          # Anything else (spaces, quotes, semicolons, substitutions) is rejected
          # before the value can be used as a git ref.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "ERROR: tag '$tag' is not a valid release tag (expected e.g. v0.0.1 or v0.0.1-rc.1)." >&2
            exit 1
          fi

          release_type="${INPUT_TYPE:-prerelease}"
          case "$release_type" in
            prerelease|stable) ;;
            *)
              echo "ERROR: release_type must be 'prerelease' or 'stable', got '$release_type'." >&2
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"
          echo "Validated tag=$tag, release_type=$release_type"

  verify-version:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Safe: comes from the validate job, which only emits a value matching
          # ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$.
          ref: ${{ needs.validate.outputs.tag }}

      - name: Check the tag matches the declared version
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "ERROR: tag '$TAG' does not match the checked-out version 'v$version'." >&2
            echo "Bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json," >&2
            echo "then tag the commit. Rebuilding an older tag requires the version to match it." >&2
            exit 1
          fi
          echo "Version check passed: tag $TAG matches version $version"

  build-desktop:
    needs: [validate, verify-version]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install Rust stable (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: dtolnay/rust-toolchain@stable

      - name: install Rust stable (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Desktop bundles are currently unsigned: bundle.createUpdaterArtifacts is
      # not enabled in tauri.conf.json, so no updater signature is produced and no
      # signing key is needed here. If updater artifacts are enabled later, this
      # job must fetch the key from Infisical the way build-android does.
      - name: Build Desktop
        run: pnpm tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.zip

  build-android:
    needs: [validate, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The machine-identity credentials are exchanged for a short-lived token
      # inside this step and used only here, so the token never reaches the
      # environment of later steps.
      - name: Fetch signing secrets from Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${INFISICAL_CLIENT_ID:-}" ] || [ -z "${INFISICAL_CLIENT_SECRET:-}" ]; then
            echo "ERROR: INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET must be set." >&2
            echo "Android builds are signed from Infisical; there is no unsigned fallback." >&2
            exit 1
          fi

          token=$(curl -fsS -X POST "https://app.infisical.com/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "clientId=${INFISICAL_CLIENT_ID}" \
            --data-urlencode "clientSecret=${INFISICAL_CLIENT_SECRET}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["accessToken"])')

          if [ -z "$token" ]; then
            echo "ERROR: Infisical returned an empty access token." >&2
            exit 1
          fi
          echo "::add-mask::${token}"

          INFISICAL_TOKEN="$token" pnpm secrets:fetch

      - name: Build Android (AAB and APK)
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_NDK_HOME"

          pnpm tauri android build --apk
          pnpm tauri android build --aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/release/*.aab

      # Signing material is injected at run time and must not survive the job.
      - name: Remove injected secrets
        if: always()
        run: |
          rm -f src-tauri/gen/android/app/keystore.properties
          rm -f src-tauri/gen/android/app/shelfsync-release.jks
          rm -f keys/updater

  publish:
    needs: [validate, build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TYPE: ${{ needs.validate.outputs.release_type }}
        run: |
          set -euo pipefail
          echo "Publishing assets for tag: $TAG ($RELEASE_TYPE)"

          echo "Artifact file tree:"
          find artifacts -type f

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no artifact files found; nothing to publish." >&2
            exit 1
          fi

          prerelease_flag=()
          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Attach to the existing release so its curated notes are preserved.
            echo "Release $TAG exists; uploading assets with --clobber."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Release $TAG does not exist; creating it."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${prerelease_flag[@]}" \
              "${files[@]}"
          fi

      - name: Verify the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TYPE: ${{ needs.validate.outputs.release_type }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$TAG" --json isPrerelease,isDraft,assets)
          echo "$release_json"

          is_prerelease=$(echo "$release_json" | jq -r '.isPrerelease')
          is_draft=$(echo "$release_json" | jq -r '.isDraft')
          asset_count=$(echo "$release_json" | jq '.assets | length')

          expected_prerelease=false
          if [ "$RELEASE_TYPE" = "prerelease" ]; then
            expected_prerelease=true
          fi

          echo "Verification: isPrerelease=$is_prerelease (expected $expected_prerelease), isDraft=$is_draft, assets=$asset_count"

          if [ "$is_draft" != "false" ]; then
            echo "Release verification failed: release is still a draft." >&2
            exit 1
          fi
          if [ "$is_prerelease" != "$expected_prerelease" ]; then
            echo "Release verification failed: expected prerelease=$expected_prerelease, got $is_prerelease." >&2
            exit 1
          fi
          if [ "$asset_count" -le 0 ]; then
            echo "Release verification failed: asset count is 0." >&2
            exit 1
          fi

          echo "Release verification passed: $asset_count assets attached."
