<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>ShelfSync - Sync Your Calibre Library</title>
    <meta name="title" content="ShelfSync - Sync Your Calibre Library" />
    <meta name="description" content="Seamlessly sync your Calibre ebook library across devices. Host your library on desktop and access books from mobile devices on your local network." />
    <meta name="keywords" content="calibre, ebook, sync, library, epub, local network, reading" />
    <meta name="author" content="jdluu" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShelfSync - Your Library, On Your Shelf" />
    <meta property="og:description" content="Browse your self-hosted OPDS catalog and take your books offline. Calm, fast, yours." />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#191714" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">

    <!-- Early Theme Initialization -->
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('theme-preference') || 'system';
          let effectiveTheme = theme;
          if (theme === 'system') {
            effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'lamplight' : 'paper';
          }
          if (effectiveTheme === 'dark') effectiveTheme = 'lamplight';
          if (effectiveTheme === 'light') effectiveTheme = 'paper';
          document.documentElement.setAttribute('data-theme', effectiveTheme);
          
          // Also set theme-color meta tag early
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', effectiveTheme === 'lamplight' ? '#191714' : '#faf7f2');
          }
        } catch (_e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
